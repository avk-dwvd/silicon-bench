name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-parser-tests:
    name: Unit and parser tests (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --upgrade pip "numpy>=1.26"

      - name: Compile Python files
        run: python -m py_compile benchmark_mlx.py report_mlx.py

      - name: Run unit, parser, and integration tests
        run: python -m unittest discover -s tests -v
